<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LootLine — Contact</title>
  <link rel="stylesheet" href="BSAI25043_style.css" />
</head>
<body>
  <!-- Section 0: Header / Navbar -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">LootLine</div>
      <nav class="nav">
        <a href="BSAI25043_Home.html" class="nav-btn">HOME</a>
        <a href="BSAI25043_Products.html" class="nav-btn">PRODUCTS</a>
        <a href="BSAI25043_Contact.html" class="nav-btn active">CONTACT</a>
      </nav>
    </div>
  </header>

  <!-- Section 1: Banner (image 0 via CSS) -->
  <section class="hero about-hero">
    <div class="hero-overlay">
      <h1 class="site-title">Contact Us</h1>
      <p class="hero-sub">We’re here to help — reach out anytime</p>
    </div>
  </section>

  <!-- Section 1.5: Email button directly beneath hero (small white wrapper) -->
  <section class="email-cta-inline">
    <div class="email-cta-box">
      <a class="btn" href="mailto:contact@lootline.store">Email Us</a>
    </div>
  </section>

  <!-- Section 2: Email Us + Social Buttons inside black strip -->
  <section class="products-check">
    <div class="social-row">
      <a href="https://www.facebook.com" target="_blank" class="social-btn">
        <img src="BSAI25043_fb.png" alt="Facebook logo" />
        <span>Facebook</span>
      </a>
      <a href="https://www.instagram.com" target="_blank" class="social-btn">
        <img src="BSAI25043_ig.png" alt="Instagram logo" />
        <span>Instagram</span>
      </a>
    </div>
  </section>

  <!-- Section 3: Footer -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <h3>Contact</h3>
        <p>Cell: +92-300-1234567</p>
        <p>Email: contact@lootline.store</p>
        <p>Location: Lahore, Pakistan</p>
      </div>
      <div>
        <h3>Quick Links</h3>
        <a href="BSAI25043_Home.html">Home</a><br />
        <a href="BSAI25043_Products.html">Products</a><br />
        <a href="BSAI25043_Contact.html">Contact</a>
      </div>
    </div>
    <div class="footer-bottom">
      <small>© <span id="year"></span> LootLine — All rights reserved.</small>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
